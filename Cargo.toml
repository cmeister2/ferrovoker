[package]
name = "ferrovoker"
version = "0.0.0"
edition = "2024"
rust-version = "1.88.0"
description = "Browser revocation feeds and certificate checks for Rust and C"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cmeister2/ferrovoker"
homepage = "https://github.com/cmeister2/ferrovoker"
readme = "README.md"
keywords = ["onecrl", "crlset", "revocation", "mozilla", "chromium"]
categories = ["network-programming", "command-line-utilities"]
include = ["/src/**", "/tests/unit/**", "/tests/fixtures/**", "/tests/emudra_compromised_intermediate.rs", "/tests/c_abi.c", "/examples/**", "/include/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-*"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ferrovoker"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "reqwest_blocking"
required-features = ["download", "rustls"]

[[example]]
name = "reqwest_async"
required-features = ["download", "rustls"]

[[example]]
name = "hyper"
required-features = ["download", "rustls"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[dependencies]
arc-swap = { version = "1.9.3", optional = true }
base64 = "0.23.1"
canonical_json = { version = "0.7.0", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
fs2 = { version = "0.4.3", optional = true }
directories = { version = "6.0.0", optional = true }
prost = { version = "0.14.4", optional = true }
quick-xml = { version = "0.42.0", features = ["serialize"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "gzip", "json", "rustls"], optional = true }
ring = { version = "0.17.14", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"], optional = true }
rustls-pki-types = { version = "1.15.1", optional = true }
rustls-webpki = { version = "0.103.16", features = ["ring"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt", "time", "fs", "sync"], optional = true }
x509-parser = "0.18.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"], optional = true }

[features]
default = ["download"]
download = ["dep:reqwest", "dep:quick-xml", "dep:zip", "dep:directories", "dep:fs2", "dep:arc-swap", "dep:tempfile", "dep:tokio", "dep:ring", "dep:prost", "dep:canonical_json", "dep:rustls-webpki", "dep:rustls-pki-types"]
rustls = ["dep:rustls"]
cli = ["download", "dep:clap"]
ffi = ["download", "tokio/rt-multi-thread"]

[dev-dependencies]
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "aws-lc-rs"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
rcgen = { version = "=0.14.10", features = ["aws_lc_rs"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
webpki-roots = "=1.0.10"
x509-parser = { version = "=0.18.1", features = ["verify"] }
