name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.88.0]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo check --locked --all-targets --all-features
      - run: cargo check --locked --no-default-features --lib
      - run: cargo test --locked --no-default-features --lib
      - run: cargo test --locked --all-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  msrv:
    name: Verify declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-msrv --locked
      - run: cargo msrv verify -- cargo check --locked --all-targets --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error

  release-tooling:
    name: Release tooling regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm test

  c-abi:
    name: C shared library and header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --features ffi
      - name: Compile and run the C ABI test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/c_abi.c -Ltarget/debug -lferrovoker -o target/c_abi
          LD_LIBRARY_PATH=target/debug target/c_abi
          cc -std=c11 -Wall -Wextra -Werror -Iinclude examples/c/check_chain.c -Ltarget/debug -lferrovoker -o target/check_chain

  release:
    name: Publish release
    needs: [rust, msrv, coverage, release-tooling, c-abi]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Set a build version when no release was produced
        run: |
          if grep -q '^version = "0\.0\.0"$' Cargo.toml; then
            node scripts/prepare-release.mjs "0.0.${GITHUB_RUN_ID}"
          fi
      - run: cargo build --release --locked --features cli,ffi
      - uses: actions/upload-artifact@v7
        with:
          name: ferrovoker-linux-x86_64
          path: |
            target/release/ferrovoker
            target/release/libferrovoker.so
            include/ferrovoker.h
          if-no-files-found: error

  success:
    name: Success
    if: ${{ always() }}
    needs: [rust, msrv, coverage, release-tooling, c-abi, release]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RELEASE_TOOLING_RESULT: ${{ needs.release-tooling.result }}
          C_ABI_RESULT: ${{ needs.c-abi.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          for result in \
            "$RUST_RESULT" \
            "$MSRV_RESULT" \
            "$COVERAGE_RESULT" \
            "$RELEASE_TOOLING_RESULT" \
            "$C_ABI_RESULT"
          do
            if [ "$result" != success ]; then
              echo "A required CI job finished with result: $result" >&2
              exit 1
            fi
          done

          case "$RELEASE_RESULT" in
            success|skipped) ;;
            *)
              echo "The release job finished with result: $RELEASE_RESULT" >&2
              exit 1
              ;;
          esac
